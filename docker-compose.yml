services:
  web:
    build: .
    container_name: portfolio-web
    restart: always
    environment:
      - NODE_ENV=production
      # Cap Node heap so container stays under limit; 1280MB heap + ~256MB overhead fits 1.5G
      - NODE_OPTIONS=--max-old-space-size=1280
    deploy:
      resources:
        limits:
          memory: 1536M
    ports:
      - "3000:3000"
    expose:
      - "3000"
    networks:
      - nginx-proxy-manage_default
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  nginx-proxy-manage_default:
    external: true
