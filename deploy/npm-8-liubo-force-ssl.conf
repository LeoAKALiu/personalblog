# ------------------------------------------------------------
# liubo.xin (portfolio) - with Force SSL on HTTP (location / -> 301 https)
# Used to patch NPM proxy_host/8.conf. If you edit liubo.xin in NPM UI,
# re-enable "Force SSL" there or re-apply this file and nginx -s reload.
# ------------------------------------------------------------

server {
  listen 80;
  listen [::]:80;
  server_name www.liubo.xin;

  location ^~ /.well-known/acme-challenge/ {
    root /data/letsencrypt-acme-challenge;
    default_type "text/plain";
  }
  location / {
    return 301 http://liubo.xin$request_uri;
  }
}

# Direct container-to-container upstream (bypasses docker-proxy entirely)
upstream liubo_backend {
  server portfolio-web:3000;
  keepalive 16;
}

server {
  set $forward_scheme http;
  set $server         "portfolio-web";
  set $port           3000;

  listen 80;
  listen [::]:80;

  server_name liubo.xin;

  access_log /data/logs/proxy-host-8_access.log proxy;
  error_log /data/logs/proxy-host-8_error.log warn;

  location ^~ /.well-known/acme-challenge/ {
    root /data/letsencrypt-acme-challenge;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }

  include /data/nginx/custom/server_proxy[.]conf;
}


server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;

  server_name liubo.xin;

  ssl_certificate /etc/letsencrypt/archive/npm-2/fullchain1.pem;
  ssl_certificate_key /etc/letsencrypt/archive/npm-2/privkey1.pem;

  access_log /data/logs/proxy-host-8_access.log proxy;
  error_log /data/logs/proxy-host-8_error.log warn;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 1800;
    proxy_connect_timeout 60;
    proxy_send_timeout 1800;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Scheme $scheme;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    add_header X-Served-By $host;
    proxy_pass http://liubo_backend;
  }

  include /data/nginx/custom/server_proxy[.]conf;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;

  server_name www.liubo.xin;

  ssl_certificate /etc/letsencrypt/archive/npm-2/fullchain1.pem;
  ssl_certificate_key /etc/letsencrypt/archive/npm-2/privkey1.pem;

  return 301 https://liubo.xin$request_uri;
}
